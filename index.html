/* ===== STUDENT INLINE PASSWORD LOGIN + ALWAYS CHANGE PASSWORD ===== */
(function(){
  function ilSave(){
    try{ if(typeof normalize==="function") normalize(); }catch(e){}
    try{ if(typeof saveLocal==="function") saveLocal(); }catch(e){}
    try{
      if(typeof sb !== "undefined" && sb && typeof pushRemote==="function") pushRemote();
      else if(typeof save==="function") save();
    }catch(e){ console.warn("inline login save skipped", e); }
  }
  function ilActiveShare(studentId){
    try{
      if(typeof pwActiveShare==="function") return pwActiveShare(studentId);
    }catch(e){}
    return null;
  }
  function ilCanOpenWithoutPassword(studentId){
    return !state.settings.requireStudentPassword || !!ilActiveShare(studentId);
  }
  function ilPhoto(studentId){
    try{
      if(typeof clickableStudentPhoto==="function") return clickableStudentPhoto(studentId);
      const s = student(studentId);
      if(!s) return "";
      if(s.photo) return `<img class="clickablePhoto" src="${s.photo}" alt="${esc(s.name)}">`;
      const initials = String(s.name||"ST").trim().split(/\s+/).map(x=>x[0]||"").join("").slice(0,2).toUpperCase() || "ST";
      return `<div class="clickableAvatar">${esc(initials)}</div>`;
    }catch(e){ return ""; }
  }
  function ilOpenStudent(id){
    currentStudentId = id;
    role = "student";
    route = "studentHome";
    renderShell();
  }

  window.studentCardLogin = function(studentId){
    const s = student(studentId);
    if(!s) return alert("Student not found.");
    currentStudentId = studentId;

    if(ilCanOpenWithoutPassword(studentId)){
      ilOpenStudent(studentId);
      return;
    }

    const input = document.getElementById("inlinePass_"+studentId);
    const typed = (input?.value || "").trim();
    if(!typed){
      if(input) input.focus();
      return alert("Please type your password first.");
    }
    if(typed !== String(s.password || "")){
      if(input){ input.value=""; input.focus(); }
      return alert("Wrong password. Please check the password and try again.");
    }
    ilOpenStudent(studentId);
  };

  window.studentInlineFocus = function(studentId){
    setTimeout(()=>{
      const input = document.getElementById("inlinePass_"+studentId);
      if(input) input.focus();
    },50);
  };

  window.selectStudentLogin = function(id){
    currentStudentId = id;
    if(ilCanOpenWithoutPassword(id)){
      ilOpenStudent(id);
      return;
    }
    studentInlineFocus(id);
  };

  window.quickOpenStudentPortal = function(id){
    currentStudentId = id;
    if(ilCanOpenWithoutPassword(id)){
      ilOpenStudent(id);
      return;
    }
    studentInlineFocus(id);
  };

  window.finishStudentLogin = function(){
    const s = student(currentStudentId);
    if(!s) return;
    if(ilCanOpenWithoutPassword(s.id)){
      ilOpenStudent(s.id);
      return;
    }
    const input = document.getElementById("stuPass") || document.getElementById("studentPass") || document.getElementById("inlinePass_"+s.id);
    if((input?.value || "").trim() !== String(s.password || "")){
      return alert("Wrong password.");
    }
    ilOpenStudent(s.id);
  };

  const oldBuildStudentVisibleList = window.buildStudentVisibleList;
  window.buildStudentVisibleList = function(list, mode="student"){
    if(mode !== "student"){
      if(typeof oldBuildStudentVisibleList==="function") return oldBuildStudentVisibleList.apply(this, arguments);
    }
    return `<div class="studentFullListGrid">
      ${list.map(s=>`<div class="studentFullListItem inlinePasswordReady" ondblclick="quickOpenStudentPortal('${s.id}')">
        ${ilPhoto(s.id)}
        <div class="studentFullInfo">
          <b>${esc(s.name)}</b>
          <small>${esc(s.phone || "No phone number")}</small>
          <small>${esc(s.code || "")} • ${esc(s.className || "")} • ${esc(subjectForClass(s.className)||"")}</small>
          <small class="openLine">${ilCanOpenWithoutPassword(s.id) ? "Click Open Portal to enter directly during the 24-hour window" : "Type your password and click Open Portal"}</small>
        </div>
        <div class="studentInlineLoginBox" onclick="event.stopPropagation()">
          <input id="inlinePass_${s.id}" type="password" placeholder="Password" onkeydown="if(event.key==='Enter'){studentCardLogin('${s.id}')}">
          <button onclick="studentCardLogin('${s.id}')">Open Portal</button>
          <div class="studentInlineLoginHint">Tip: Type your password on your own name card, then click Open Portal. If Sir Isaac has shared a 24-hour access window, you can open without typing password.</div>
        </div>
      </div>`).join("") || `<div class="empty">No student found.</div>`}
    </div>`;
  };

  window.changeOwnPasswordAnytime = function(){
    const s = student(currentStudentId);
    if(!s) return;
    const p1 = (document.getElementById("changePasswordAnytime1")?.value || "").trim();
    const p2 = (document.getElementById("changePasswordAnytime2")?.value || "").trim();
    if(!p1 || !p2) return alert("Type the new password twice.");
    if(p1.length < 4) return alert("Password should be at least 4 characters.");
    if(p1 !== p2) return alert("The two passwords do not match.");
    if(!confirm("Save this as your new portal password?")) return;
    s.password = p1;
    if(Array.isArray(state.passwordShares)){
      state.passwordShares.forEach(p=>{
        if(p.studentId===s.id && p.active!==false){
          p.password = p1;
          p.changedByStudentAt = new Date().toISOString();
        }
      });
    }
    ilSave();
    alert("Your password has been changed successfully. Use the new password next time.");
    if(typeof studentHome==="function") studentHome();
  };

  function changePasswordAnytimeHTML(studentId){
    const s = student(studentId);
    if(!s) return "";
    return `<div id="changePasswordAnytimeBox_${studentId}" class="changePasswordAnytimeBox">
      <h3>Change Your Password Anytime</h3>
      <p>You can change your portal password anytime after logging in. Keep the new password safely because you will use it for your next login.</p>
      <div class="changePasswordGrid">
        <div><label>New Password</label><input id="changePasswordAnytime1" type="password" placeholder="Enter new password"></div>
        <div><label>Confirm Password</label><input id="changePasswordAnytime2" type="password" placeholder="Repeat new password"></div>
        <button onclick="changeOwnPasswordAnytime()">Save New Password</button>
      </div>
    </div>`;
  }

  const oldStudentHome = window.studentHome;
  window.studentHome = function(){
    const result = oldStudentHome ? oldStudentHome.apply(this, arguments) : undefined;
    const s = student(currentStudentId);
    const view = document.getElementById("view");
    if(view && s && !document.getElementById("changePasswordAnytimeBox_"+s.id)){
      const existing24 = document.getElementById("studentPasswordChangeBox_"+s.id);
      if(existing24) existing24.insertAdjacentHTML("afterend", changePasswordAnytimeHTML(s.id));
      else view.insertAdjacentHTML("beforeend", changePasswordAnytimeHTML(s.id));
    }
    return result;
  };

  // Re-render student login once after page opens so the inline boxes appear even on cached views.
  const oldStudentLogin = window.studentLogin;
  if(typeof oldStudentLogin==="function"){
    window.studentLogin = function(){
      const result = oldStudentLogin.apply(this, arguments);
      return result;
    };
  }

  try{
    eval("studentCardLogin=window.studentCardLogin; studentInlineFocus=window.studentInlineFocus; selectStudentLogin=window.selectStudentLogin; quickOpenStudentPortal=window.quickOpenStudentPortal; finishStudentLogin=window.finishStudentLogin; buildStudentVisibleList=window.buildStudentVisibleList; changeOwnPasswordAnytime=window.changeOwnPasswordAnytime;");
  }catch(e){}
})();

  window.refreshStudentWorkPanel = function(studentId){
    const old=document.getElementById(`studentWorkPanel_${studentId}`);
    if(old) old.outerHTML = studentWorkSummaryHTML(studentId);
  };

  window.resetQuizForStudent = function(studentId, quizId){
    asEnsure();
    const st=asStudent(studentId), q=asQuiz(quizId);
    if(!st || !q) return alert("Student or quiz not found.");
    const matching = (state.submissions||[]).filter(s=>String(s.studentId)===String(studentId) && String(s.quizId)===String(quizId));
    if(!matching.length){
      // Still create an access reset if teacher wants to allow a fresh attempt.
      if(!confirm(st.name + " has no recorded submission for this quiz.\n\nDo you still want to allow a fresh attempt?")) return;
    }else{
      if(!confirm("Reset this quiz for " + st.name + "?\n\nThis will remove the previous submission, answers, score, and published result for this quiz. The student will be able to do it afresh.")) return;
    }

    // Remove every old submission/score/answers for this student and quiz.
    state.submissions = (state.submissions||[]).filter(s=>!(String(s.studentId)===String(studentId) && String(s.quizId)===String(quizId)));

    // Clear any old active reset records for this exact student and quiz, then add a fresh access record.
    state.quizResets = (state.quizResets||[]).map(r=>{
      if(String(r.studentId)===String(studentId) && String(r.quizId)===String(quizId) && r.active){
        return {...r, active:false, replacedAt:asNow()};
      }
      return r;
    });
    state.quizResets.push({
      id:asUid("reset"),
      studentId,
      quizId,
      createdAt:asNow(),
      active:true,
      reason:"Teacher reset after complaint / technical issue"
    });

    // Keep the quiz available to that student even if hidden from the general class list.
    q.resetAvailableFor = Array.isArray(q.resetAvailableFor) ? q.resetAvailableFor : [];
    if(!q.resetAvailableFor.includes(studentId)) q.resetAvailableFor.push(studentId);

    asSave();
    alert("Quiz reset successfully.\n\nPrevious answers and marks have been removed. The student can now start the quiz afresh.");
    refreshStudentWorkPanel(studentId);
    if(typeof adminExerciseRefreshHub==="function") adminExerciseRefreshHub();
  };

  const oldAvailableQuizzes = window.availableQuizzes;
  window.availableQuizzes = function(){
    asEnsure();
    const s=asStudent(currentStudentId);
    if(!s) return [];
    const subj=asSubject(s.className);
    const activeResetQuizIds = new Set((state.quizResets||[])
      .filter(r=>String(r.studentId)===String(s.id) && r.active)
      .map(r=>String(r.quizId)));
    const list=(state.quizzes||[]).filter(q=>{
      const assigned = q.subject===subj && (q.classNames||[]).includes(s.className);
      const normallyVisible = q.status==="Published" && assigned;
      const resetVisible = assigned && (activeResetQuizIds.has(String(q.id)) || (q.resetAvailableFor||[]).includes(s.id));
      return normallyVisible || resetVisible;
    });
    const seen=new Set();
    return list.filter(q=>{ if(seen.has(q.id)) return false; seen.add(q.id); return true; });
  };

  const oldSubmitQuiz = window.submitQuiz;
  if(typeof oldSubmitQuiz==="function"){
    window.submitQuiz = function(id, auto=false){
      asEnsure();
      // Mark the reset as used only when a new submission is starting.
      (state.quizResets||[]).forEach(r=>{
        if(String(r.studentId)===String(currentStudentId) && String(r.quizId)===String(id) && r.active){
          r.active=false;
          r.usedAt=asNow();
        }
      });
      const q=asQuiz(id);
      if(q && Array.isArray(q.resetAvailableFor)){
        q.resetAvailableFor = q.resetAvailableFor.filter(x=>String(x)!==String(currentStudentId));
      }
      return oldSubmitQuiz.apply(this, arguments);
    };
  }

  try{
    eval("students=window.students; adminShowStudentProfileAll=window.adminShowStudentProfileAll; adminShowStudentProfileFixed=window.adminShowStudentProfileFixed; studentWorkSummaryHTML=window.studentWorkSummaryHTML; refreshStudentWorkPanel=window.refreshStudentWorkPanel; resetQuizForStudent=window.resetQuizForStudent; availableQuizzes=window.availableQuizzes; submitQuiz=window.submitQuiz;");
  }catch(e){}
})();

    const c=sqReportComponents().find(x=>x.key===key);
    return c ? c.label : key;
  }
  function sqSetReport(studentId,key,scorePercent){
    let r;
    try{
      if(typeof getReportRecord==="function") r=getReportRecord(studentId);
    }catch(e){}
    if(!r){
      state.reportScores = state.reportScores || [];
      r = state.reportScores.find(x=>x.studentId===studentId);
      if(!r){ r={id:sqUid("rep"),studentId}; state.reportScores.push(r); }
    }
    let n = Number(scorePercent);
    if(Number.isNaN(n)) n=0;
    if(n<0)n=0;
    if(n>100)n=100;
    r[key]=Math.round(n*100)/100;
  }
  function sqScorePercent(sub){
    const score = Number(sub.teacherScore ?? sub.autoScore ?? sub.score ?? 0);
    const max = Number(sub.maxScore || 100);
    return max ? Math.round((score/max)*10000)/100 : 0;
  }

  function normalizeQuizPackage(raw, settings){
    let data;
    try{ data = JSON.parse(raw); }
    catch(e){ throw new Error("The quiz package is not valid JSON. Copy the package exactly as given."); }

    if(Array.isArray(data)) data = {questions:data};
    if(!Array.isArray(data.questions)) throw new Error("The quiz package must contain a questions array.");

    const letters = ["A","B","C","D","E","F"];
    const questions = data.questions.map((q,i)=>{
      let choices = q.choices || q.options || q.alternatives;
      if(choices && !Array.isArray(choices) && typeof choices==="object"){
        choices = letters.map(l=>choices[l]).filter(x=>x!==undefined);
      }
      if(!Array.isArray(choices) || choices.length < 2) throw new Error("Question "+(i+1)+" must have at least two choices.");
      const answer = String(q.answer || q.correct || q.correctAnswer || "").trim().toUpperCase();
      if(!answer) throw new Error("Question "+(i+1)+" has no correct answer.");
      return {
        id: q.id || sqUid("q"),
        type: "mcq",
        marks: Number(q.marks || 1),
        prompt: q.prompt || q.question || q.text || "",
        choices: choices.map(String),
        answer: answer
      };
    });
    if(!questions.length) throw new Error("No questions found in the package.");

    const title = (settings.title || data.title || "Imported MCQ Exercise").trim();
    const subject = settings.subject || data.subject || state.subjects?.[0]?.name || "Mathematics";
    const durationMinutes = Number(settings.duration || data.durationMinutes || data.duration || 30) || 30;
    const classes = settings.classNames && settings.classNames.length ? settings.classNames : (data.classNames || sqSubjectClasses(subject));
    const status = settings.status || data.status || "Draft";
    const assessmentComponent = settings.assessmentComponent || data.assessmentComponent || "ex1";
    return {title,subject,durationMinutes,classNames:classes,status,assessmentComponent,assignmentType:"Exercise",questions};
  }

/* ===== DIGITAL MARKING BOARD FIX: SMOOTH INK, COLORS, ERASER, CLEAR ===== */
(function(){
  let dmState = {
    subId:null,
    fileIndex:0,
    color:"#d92d20",
    eraser:false,
    drawing:false,
    lastX:0,
    lastY:0,
    history:[]
  };

  function dmSaveApp(){
    try{ if(typeof normalize==="function") normalize(); }catch(e){}
    try{ if(typeof saveLocal==="function") saveLocal(); }catch(e){}
    try{
      if(typeof sb !== "undefined" && sb && typeof pushRemote==="function") pushRemote();
      else if(typeof save==="function") save();
    }catch(e){ console.warn("marking save skipped", e); }
  }
  function dmNow(){
    try{ return typeof now==="function" ? now() : new Date().toLocaleString(); }
    catch(e){ return new Date().toLocaleString(); }
  }
  function dmGetCanvas(){
    return document.getElementById("markerCanvas");
  }
  function dmGetCtx(){
    const c = dmGetCanvas();
    return c ? c.getContext("2d") : null;
  }
  function dmSetActiveButtons(){
    document.querySelectorAll(".colorDotBtn").forEach(btn=>{
      btn.classList.toggle("active", btn.dataset.color === dmState.color && !dmState.eraser);
    });
    const eraser = document.getElementById("toolEraser");
    if(eraser) eraser.classList.toggle("active", dmState.eraser);
  }
  function dmPushHistory(){
    const c = dmGetCanvas();
    if(!c) return;
    try{
      dmState.history.push(c.toDataURL("image/png"));
      if(dmState.history.length > 15) dmState.history.shift();
    }catch(e){}
  }
  function dmCanvasPoint(evt){
    const c = dmGetCanvas();
    const r = c.getBoundingClientRect();
    const scaleX = c.width / r.width;
    const scaleY = c.height / r.height;
    return {
      x:(evt.clientX - r.left) * scaleX,
      y:(evt.clientY - r.top) * scaleY
    };
  }
  function dmLineTo(evt){
    if(!dmState.drawing) return;
    const c = dmGetCanvas();
    const ctx = dmGetCtx();
    if(!c || !ctx) return;

    const p = dmCanvasPoint(evt);
    const size = Math.max(1, Number(document.getElementById("markerSize")?.value) || 5);

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = size;

    if(dmState.eraser){
      ctx.globalCompositeOperation = "destination-out";
      ctx.strokeStyle = "rgba(0,0,0,1)";
    }else{
      ctx.globalCompositeOperation = "source-over";
      ctx.strokeStyle = dmState.color || "#d92d20";
    }

    ctx.beginPath();
    ctx.moveTo(dmState.lastX, dmState.lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.restore();

    dmState.lastX = p.x;
    dmState.lastY = p.y;
    evt.preventDefault();
  }
  function dmStart(evt){
    const c = dmGetCanvas();
    if(!c) return;
    dmPushHistory();
    const p = dmCanvasPoint(evt);
    dmState.drawing = true;
    dmState.lastX = p.x;
    dmState.lastY = p.y;
    try{ c.setPointerCapture(evt.pointerId); }catch(e){}
    evt.preventDefault();
  }
  function dmEnd(evt){
    dmState.drawing = false;
    try{ dmGetCanvas()?.releasePointerCapture(evt.pointerId); }catch(e){}
    evt.preventDefault();
  }

  window.markerTool = function(tool){
    dmState.eraser = false;
    if(tool === "red") dmState.color = "#d92d20";
    else if(tool === "blue") dmState.color = "#155eef";
    else if(tool === "black") dmState.color = "#111111";
    else if(tool === "green") dmState.color = "#0f7b4f";
    else if(tool === "eraser") dmState.eraser = true;
    dmSetActiveButtons();
  };

  window.markerSetColor = function(color){
    dmState.color = color || "#d92d20";
    dmState.eraser = false;
    dmSetActiveButtons();
  };

  window.clearMarkerCanvas = function(){
    const c = dmGetCanvas();
    if(!c) return;
    if(!confirm("Clear all ink on this page?")) return;
    dmPushHistory();
    c.getContext("2d").clearRect(0,0,c.width,c.height);
  };

  window.undoMarkerInk = function(){
    const c = dmGetCanvas();
    const ctx = dmGetCtx();
    if(!c || !ctx || !dmState.history.length) return alert("No ink action to undo.");
    const url = dmState.history.pop();
    const img = new Image();
    img.onload = function(){
      ctx.clearRect(0,0,c.width,c.height);
      ctx.drawImage(img,0,0,c.width,c.height);
    };
    img.src = url;
  };

  window.setupMarkerCanvas = function(){
    const img = document.getElementById("markerImage");
    const c = document.getElementById("markerCanvas");
    if(!img || !c) return;

    // Give the image time to settle in the visible layout, then match canvas exactly to it.
    setTimeout(()=>{
      const rect = img.getBoundingClientRect();
      const displayWidth = Math.max(1, Math.round(rect.width || img.clientWidth || img.naturalWidth || 800));
      const displayHeight = Math.max(1, Math.round(rect.height || img.clientHeight || img.naturalHeight || 1000));
      const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));

      c.style.width = displayWidth + "px";
      c.style.height = displayHeight + "px";
      c.width = Math.round(displayWidth * dpr);
      c.height = Math.round(displayHeight * dpr);

      const ctx = c.getContext("2d");
      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0,0,c.width,c.height);

      c.onpointerdown = dmStart;
      c.onpointermove = dmLineTo;
      c.onpointerup = dmEnd;
      c.onpointercancel = dmEnd;
      c.onpointerleave = function(e){ if(dmState.drawing) dmEnd(e); };

      dmState.history = [];
      dmState.color = "#d92d20";
      dmState.eraser = false;
      dmSetActiveButtons();
    }, 120);
  };

  window.openDigitalMarker = function(subId,fileIndex){
    const ds = (state.docSubmissions||[]).find(x=>x.id===subId);
    if(!ds) return alert("Submission not found.");
    const f = ds.files?.[fileIndex];
    if(!f) return alert("File not found.");
    if(!String(f.type||"").startsWith("image/")){
      window.open(f.data, "_blank");
      return;
    }

    const old = document.getElementById("markerOverlay");
    if(old) old.remove();

    document.body.insertAdjacentHTML("beforeend",`<div id="markerOverlay" class="markerOverlay">
      <div class="markerModal">
        <div class="markerHeader">
          <h2>Digital Marking Board</h2>
          <button onclick="document.getElementById('markerOverlay').remove()">Close</button>
        </div>
        <div class="markerTools">
          <button type="button" class="colorDotBtn active" data-color="#d92d20" style="background:#d92d20" title="Red pen" onclick="markerSetColor('#d92d20')"></button>
          <button type="button" class="colorDotBtn" data-color="#155eef" style="background:#155eef" title="Blue pen" onclick="markerSetColor('#155eef')"></button>
          <button type="button" class="colorDotBtn" data-color="#111111" style="background:#111111" title="Black pen" onclick="markerSetColor('#111111')"></button>
          <button type="button" class="colorDotBtn" data-color="#0f7b4f" style="background:#0f7b4f" title="Green pen" onclick="markerSetColor('#0f7b4f')"></button>
          <button id="toolEraser" class="eraserBtn" type="button" onclick="markerTool('eraser')">Eraser</button>
          <button class="undoBtn" type="button" onclick="undoMarkerInk()">Undo</button>
          <button class="clearBtn" type="button" onclick="clearMarkerCanvas()">Clear All Ink</button>
          <label class="markerSizeWrap">Pen Size <input id="markerSize" type="number" value="5" min="1" max="40"></label>
          <span class="markerInkHelp">Default ink is red. Use eraser to clean only the ink. Use Clear All to remove all ink on the page.</span>
        </div>
        <div class="markerCanvasWrap">
          <div class="markerPage">
            <img id="markerImage" src="${f.data}" alt="">
            <canvas id="markerCanvas"></canvas>
          </div>
        </div>
        <div class="markerFooter">
          <input id="markerScore" type="number" placeholder="Score" value="${ds.score ?? ""}">
          <textarea id="markerFeedback" placeholder="Feedback">${(typeof esc==="function"?esc(ds.feedback||""):(ds.feedback||""))}</textarea>
          <button class="btn green" onclick="saveMarkedWork('${subId}',${fileIndex})">Save Marked Copy</button>
          <button class="btn gold" onclick="publishMarkedWork('${subId}',${fileIndex})">Save & Publish</button>
        </div>
      </div>
    </div>`);

    dmState = {subId,fileIndex,color:"#d92d20",eraser:false,drawing:false,lastX:0,lastY:0,history:[]};

    const img = document.getElementById("markerImage");
    if(img.complete) setupMarkerCanvas();
    else img.onload = setupMarkerCanvas;
    window.addEventListener("resize", function once(){
      if(document.getElementById("markerOverlay")) setupMarkerCanvas();
      window.removeEventListener("resize", once);
    });
  };

  window.saveMarkedWork = function(subId,fileIndex){
    const ds = (state.docSubmissions||[]).find(x=>x.id===subId);
    if(!ds) return alert("Submission not found.");
    const img = document.getElementById("markerImage");
    const c = document.getElementById("markerCanvas");
    if(!img || !c) return alert("Marking board not ready.");

    const out = document.createElement("canvas");
    out.width = c.width;
    out.height = c.height;
    const ctx = out.getContext("2d");

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0,0,out.width,out.height);
    ctx.drawImage(img,0,0,out.width,out.height);
    ctx.drawImage(c,0,0);

    ds.markedFiles = Array.isArray(ds.markedFiles) ? ds.markedFiles : [];
    ds.markedFiles[fileIndex] = {
      name:"marked_" + (ds.files?.[fileIndex]?.name || "work.png").replace(/\.[^.]+$/,"") + ".png",
      type:"image/png",
      data:out.toDataURL("image/png"),
      savedAt:dmNow()
    };
    ds.score = Number(document.getElementById("markerScore")?.value) || 0;
    ds.feedback = document.getElementById("markerFeedback")?.value || "";

    // If the simplified scanned-work component feature exists, also push score into the chosen cumulative component.
    try{
      const a = (state.docAssignments||[]).find(x=>x.id===ds.assignmentId) || {};
      if(typeof getReportRecord==="function" && a.assessmentComponent){
        const r = getReportRecord(ds.studentId);
        const max = Number(a.maxScore||100);
        const pct = max ? Math.round((Number(ds.score||0)/max)*10000)/100 : 0;
        r[a.assessmentComponent] = pct;
      }
    }catch(e){}

    dmSaveApp();
    alert("Marked work saved successfully.");
  };

  window.publishMarkedWork = function(subId,fileIndex){
    saveMarkedWork(subId,fileIndex);
    const ds = (state.docSubmissions||[]).find(x=>x.id===subId);
    if(ds){
      ds.published = true;
      dmSaveApp();
      alert("Marked work saved and published to the student portal.");
      document.getElementById("markerOverlay")?.remove();
      if(typeof review==="function" && role==="admin") review();
    }
  };

  try{
    eval("openDigitalMarker=window.openDigitalMarker; setupMarkerCanvas=window.setupMarkerCanvas; markerTool=window.markerTool; markerSetColor=window.markerSetColor; clearMarkerCanvas=window.clearMarkerCanvas; undoMarkerInk=window.undoMarkerInk; saveMarkedWork=window.saveMarkedWork; publishMarkedWork=window.publishMarkedWork;");
  }catch(e){}
})();


/* ===== MARKING TOOLS VISIBLE + STUDENT MARKED SCRIPT DISPLAY ===== */
(function(){
  function mtSave(){
    try{ if(typeof normalize==="function") normalize(); }catch(e){}
    try{ if(typeof saveLocal==="function") saveLocal(); }catch(e){}
    try{
      if(typeof sb !== "undefined" && sb && typeof pushRemote==="function") pushRemote();
      else if(typeof save==="function") save();
    }catch(e){ console.warn("marked script save skipped", e); }
  }
  function mtEsc(v){ return typeof esc==="function" ? esc(v) : String(v ?? ""); }
  function mtAssignment(id){ return (state.docAssignments||[]).find(a=>a.id===id) || {}; }
  function mtNow(){ try{ return typeof now==="function" ? now() : new Date().toLocaleString(); }catch(e){ return new Date().toLocaleString(); } }

  const previousOpenDigitalMarker = window.openDigitalMarker;
  if(typeof previousOpenDigitalMarker === "function"){
    window.openDigitalMarker = function(subId,fileIndex){
      const result = previousOpenDigitalMarker.apply(this, arguments);
      setTimeout(function(){
        const tools = document.querySelector(".markerTools");
        const modal = document.querySelector(".markerModal");
        const wrap = document.querySelector(".markerCanvasWrap");
        if(modal) modal.style.gridTemplateRows = "auto auto minmax(0,1fr) auto";
        if(tools){
          tools.style.position = "relative";
          tools.style.zIndex = "999";
          tools.style.visibility = "visible";
          tools.style.opacity = "1";
        }
        if(wrap){
          wrap.style.zIndex = "1";
          wrap.style.minHeight = "0";
        }
      }, 250);
      return result;
    };
  }

  const oldPublishMarkedWork = window.publishMarkedWork;
  window.publishMarkedWork = function(subId,fileIndex){
    if(typeof saveMarkedWork === "function"){
      saveMarkedWork(subId,fileIndex);
    }else if(typeof oldPublishMarkedWork === "function"){
      oldPublishMarkedWork.apply(this, arguments);
    }
    const ds = (state.docSubmissions||[]).find(x=>x.id===subId);
    if(ds){
      ds.published = true;
      ds.publishedAt = mtNow();
      const scoreInput = document.getElementById("markerScore");
      const feedbackInput = document.getElementById("markerFeedback");
      if(scoreInput) ds.score = Number(scoreInput.value) || 0;
      if(feedbackInput) ds.feedback = feedbackInput.value || "";
      mtSave();
    }
    alert("Marked script and score have been published to the student's portal.");
    document.getElementById("markerOverlay")?.remove();
    if(typeof review === "function" && role === "admin") review();
  };

  function markedFilesHTML(ds){
    const files = (ds.markedFiles||[]).filter(Boolean);
    if(!files.length) return '<div class="empty">Marked copy has not been saved yet.</div>';
    return '<div class="markedFilesGrid">'+files.map(function(f,i){
      const isImg = String(f.type||"").startsWith("image/") || String(f.data||"").startsWith("data:image");
      return '<div class="markedFileBox"><b>Marked Page '+(i+1)+'</b>'+(isImg?'<img src="'+f.data+'" alt="Marked script">':'<p>'+mtEsc(f.name||"Marked file")+'</p>')+'<a href="'+f.data+'" target="_blank">Open Marked Script</a></div>';
    }).join("")+'</div>';
  }

  window.studentMarkedScriptsHTML = function(){
    const sid = currentStudentId;
    if(!sid) return "";
    const rows = (state.docSubmissions||[]).filter(ds=>ds.studentId===sid && ds.published).sort((a,b)=>String(b.publishedAt||b.submittedAt||"").localeCompare(String(a.publishedAt||a.submittedAt||"")));
    if(!rows.length){
      return '<div class="markedScriptStudentPanel"><h2>My Marked Scripts</h2><p>No marked script has been published yet.</p></div>';
    }
    return '<div class="markedScriptStudentPanel" id="studentMarkedScriptsPanel"><h2>My Marked Scripts and Scores</h2><p>When Sir Isaac marks and publishes your submitted work, your marked script and score will appear here.</p>'+
      rows.map(function(ds){
        const a = mtAssignment(ds.assignmentId);
        return '<div class="markedScriptCard"><h3>'+mtEsc(a.title || "Marked Work")+'</h3><div class="markedScriptMeta"><div><span>Score</span><b>'+(ds.score ?? "-")+' / '+(a.maxScore ?? "-")+'</b></div><div><span>Status</span><b>Published</b></div><div><span>Submitted</span><b>'+mtEsc(ds.submittedAt || "")+'</b></div><div><span>Published</span><b>'+mtEsc(ds.publishedAt || "")+'</b></div></div>'+(ds.feedback?'<p><b>Teacher Comment:</b> '+mtEsc(ds.feedback)+'</p>':"")+markedFilesHTML(ds)+'</div>';
      }).join("")+'</div>';
  };

  const oldStudentResults = window.studentResults;
  window.studentResults = function(){
    if(typeof oldStudentResults === "function") oldStudentResults.apply(this, arguments);
    else document.getElementById("view").innerHTML = "";
    const view = document.getElementById("view");
    if(view && !document.getElementById("studentMarkedScriptsPanel")){
      view.insertAdjacentHTML("beforeend", studentMarkedScriptsHTML());
    }
  };

  const oldStudentHome = window.studentHome;
  window.studentHome = function(){
    const result = oldStudentHome ? oldStudentHome.apply(this, arguments) : undefined;
    const view = document.getElementById("view");
    if(view && !document.getElementById("studentMarkedScriptsPanel")){
      view.insertAdjacentHTML("beforeend", studentMarkedScriptsHTML());
    }
    return result;
  };

  try{
    eval("openDigitalMarker=window.openDigitalMarker; publishMarkedWork=window.publishMarkedWork; studentResults=window.studentResults; studentHome=window.studentHome; studentMarkedScriptsHTML=window.studentMarkedScriptsHTML;");
  }catch(e){}
})();


/* ===== FULLSCREEN MARKING, DOWNLOAD MARKED SCRIPT, ASSIGNMENT NOTICES, GROUPED REVIEW ===== */
(function(){
  function fxSave(){
    try{ if(typeof normalize==="function") normalize(); }catch(e){}
    try{ if(typeof saveLocal==="function") saveLocal(); }catch(e){}
    try{
      if(typeof sb !== "undefined" && sb && typeof pushRemote==="function") pushRemote();
      else if(typeof save==="function") save();
    }catch(e){ console.warn("fullscreen/group save skipped", e); }
  }
  function fxEsc(v){ return typeof esc==="function" ? esc(v) : String(v ?? ""); }
  function fxStudent(id){
    try{ if(typeof student==="function") return student(id); }catch(e){}
    return (state.students||[]).find(s=>s.id===id);
  }
  function fxSubjectForClass(c){
    try{ return subjectForClass(c)||""; }catch(e){ return ""; }
  }
  function fxQuiz(id){
    try{ if(typeof quiz==="function") return quiz(id); }catch(e){}
    return (state.quizzes||[]).find(q=>q.id===id);
  }
  function fxAssignment(id){ return (state.docAssignments||[]).find(a=>a.id===id) || {}; }
  function fxNow(){ try{return typeof now==="function"?now():new Date().toLocaleString();}catch(e){return new Date().toLocaleString();} }
  function fxIsNew(dateText){
    const d = new Date(dateText || "");
    if(isNaN(d.getTime())) return true;
    return (Date.now() - d.getTime()) <= 24*60*60*1000;
  }
  function fxComponentLabel(key){
    try{
      if(typeof reportComponents==="function"){
        const c=reportComponents().find(x=>x.key===key);
        if(c) return c.label;
      }
    }catch(e){}
    return key || "";
  }
  function fxScorePercent(score,max){
    score=Number(score||0); max=Number(max||100);
    return max ? Math.round((score/max)*10000)/100 : 0;
  }
  function fxAssignToReport(studentId,key,pct){
    if(!key) return;
    try{
      if(typeof getReportRecord==="function"){
        const r=getReportRecord(studentId);
        r[key]=pct;
        return;
      }
    }catch(e){}
    state.reportScores = Array.isArray(state.reportScores) ? state.reportScores : [];
    let r=state.reportScores.find(x=>x.studentId===studentId);
    if(!r){r={id:"rep_"+Date.now()+"_"+Math.random().toString(16).slice(2),studentId}; state.reportScores.push(r);}
    r[key]=pct;
  }

  window.toggleMarkingFullScreen = function(){
    const overlay=document.getElementById("markerOverlay");
    const modal=document.querySelector("#markerOverlay .markerModal");
    if(!overlay || !modal) return;
    overlay.classList.toggle("fullScreenMarking");
    modal.classList.toggle("markingFullScreen");
    const btn=document.getElementById("fullScreenMarkBtn");
    if(btn) btn.textContent = modal.classList.contains("markingFullScreen") ? "Minimize Board" : "Full Board";
    setTimeout(()=>{ try{ if(typeof setupMarkerCanvas==="function") setupMarkerCanvas(); }catch(e){} }, 180);
  };

  function addFullScreenButton(){
    const tools=document.querySelector("#markerOverlay .markerTools");
    if(tools && !document.getElementById("fullScreenMarkBtn")){
      tools.insertAdjacentHTML("afterbegin", `<button id="fullScreenMarkBtn" class="fullScreenMarkBtn" type="button" onclick="toggleMarkingFullScreen()">Full Board</button>`);
    }
  }

  const oldOpenDigitalMarker = window.openDigitalMarker;
  if(typeof oldOpenDigitalMarker==="function"){
    window.openDigitalMarker = function(subId,fileIndex){
      const result=oldOpenDigitalMarker.apply(this, arguments);
      setTimeout(addFullScreenButton, 150);
      setTimeout(addFullScreenButton, 450);
      return result;
    };
  }

  window.downloadMarkedScriptFile = function(data,name){
    if(!data) return alert("Marked script not found.");
    const a=document.createElement("a");
    a.href=data;
    a.download=name || "marked_script.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  function markedFileButtons(f,i){
    const name = f.name || ("marked_script_page_"+(i+1)+".png");
    return `<button class="downloadMarkedBtn" onclick="downloadMarkedScriptFile('${String(f.data||"").replace(/'/g,"\\'")}','${String(name).replace(/'/g,"\\'")}')">Download</button><a class="openMarkedBtn" href="${f.data}" target="_blank">Open</a>`;
  }

  function markedFilesHTML(ds){
    const files=(ds.markedFiles||[]).filter(Boolean);
    if(!files.length) return `<div class="empty">No marked copy has been published yet.</div>`;
    return `<div class="markedFilesGrid">${files.map((f,i)=>`<div class="markedFileBox">
      <b>Marked Page ${i+1}</b>
      ${String(f.type||"").startsWith("image/") || String(f.data||"").startsWith("data:image") ? `<img src="${f.data}" alt="Marked script">` : `<p>${fxEsc(f.name||"Marked file")}</p>`}
      <div>${markedFileButtons(f,i)}</div>
    </div>`).join("")}</div>`;
  }

  const oldSaveMarkedWork = window.saveMarkedWork;
  if(typeof oldSaveMarkedWork==="function"){
    window.saveMarkedWork = function(subId,fileIndex){
      const result=oldSaveMarkedWork.apply(this, arguments);
      const ds=(state.docSubmissions||[]).find(x=>x.id===subId);
      if(ds){
        const scoreInput=document.getElementById("markerScore");
        const feedbackInput=document.getElementById("markerFeedback");
        if(scoreInput) ds.score=Number(scoreInput.value)||0;
        if(feedbackInput) ds.feedback=feedbackInput.value||"";
        fxSave();
      }
      return result;
    };
  }

  const oldPublishMarkedWork = window.publishMarkedWork;
  window.publishMarkedWork = function(subId,fileIndex){
    if(typeof saveMarkedWork==="function") saveMarkedWork(subId,fileIndex);
    else if(typeof oldPublishMarkedWork==="function") oldPublishMarkedWork.apply(this, arguments);
    const ds=(state.docSubmissions||[]).find(x=>x.id===subId);
    if(ds){
      const a=fxAssignment(ds.assignmentId);
      ds.published=true;
      ds.publishedAt=fxNow();
      const scoreInput=document.getElementById("markerScore");
      const feedbackInput=document.getElementById("markerFeedback");
      if(scoreInput) ds.score=Number(scoreInput.value)||0;
      if(feedbackInput) ds.feedback=feedbackInput.value||"";
      if(a.assessmentComponent){
        fxAssignToReport(ds.studentId,a.assessmentComponent,fxScorePercent(ds.score,a.maxScore||100));
      }
      fxSave();
    }
    alert("Marked script, score, and feedback have been published to the student's portal.");
    document.getElementById("markerOverlay")?.remove();
    if(typeof review==="function" && role==="admin") review();
  };

  window.studentMarkedScriptsHTML = function(){
    const sid=currentStudentId;
    const rows=(state.docSubmissions||[]).filter(ds=>ds.studentId===sid && ds.published).sort((a,b)=>String(b.publishedAt||b.submittedAt||"").localeCompare(String(a.publishedAt||a.submittedAt||"")));
    if(!rows.length){
      return `<div class="markedScriptStudentPanel" id="studentMarkedScriptsPanel"><h2>My Marked Scripts</h2><p>No marked script has been published yet.</p></div>`;
    }
    return `<div class="markedScriptStudentPanel" id="studentMarkedScriptsPanel"><h2>My Marked Scripts and Scores</h2><p>Download or open the marked copy of your submitted work here.</p>
      ${rows.map(ds=>{const a=fxAssignment(ds.assignmentId);return `<div class="markedScriptCard">
        <h3>${fxEsc(a.title||"Marked Work")}</h3>
        <div class="markedScriptMeta">
          <div><span>Score</span><b>${ds.score ?? "-"} / ${a.maxScore ?? "-"}</b></div>
          <div><span>Component</span><b>${fxEsc(fxComponentLabel(a.assessmentComponent||""))}</b></div>
          <div><span>Submitted</span><b>${fxEsc(ds.submittedAt||"")}</b></div>
          <div><span>Published</span><b>${fxEsc(ds.publishedAt||"")}</b></div>
        </div>
        ${ds.feedback ? `<p><b>Teacher's Comment:</b> ${fxEsc(ds.feedback)}</p>` : ""}
        ${markedFilesHTML(ds)}
      </div>`}).join("")}</div>`;
  };

  window.newAssignmentNoticeHTML = function(){
    const s=fxStudent(currentStudentId);
    if(!s) return "";
    const subj=fxSubjectForClass(s.className);
    const notices=[];
    (state.quizzes||[]).forEach(q=>{
      if(q.status==="Published" && q.subject===subj && (q.classNames||[]).includes(s.className)){
        const done=(state.submissions||[]).some(x=>x.studentId===s.id && x.quizId===q.id);
        if(!done && fxIsNew(q.publishedAt||q.createdAt)) notices.push({type:"Multiple-choice exercise",title:q.title,time:q.publishedAt||q.createdAt,action:"Go to My Quizzes and click Start Exercise."});
      }
    });
    (state.docAssignments||[]).forEach(a=>{
      if(a.status==="Published" && a.subject===subj && (a.classNames||[]).includes(s.className)){
        const done=(state.docSubmissions||[]).some(x=>x.studentId===s.id && x.assignmentId===a.id);
        if(!done && fxIsNew(a.publishedAt||a.createdAt)) notices.push({type:"Theory / scanned work",title:a.title,time:a.publishedAt||a.createdAt,action:"Go to My Quizzes, open the question paper, solve it, scan your answer, and submit."});
      }
    });
    if(!notices.length) return "";
    return `<div class="newAssignmentNoticeBox" id="newAssignmentNoticeBox"><h2>📌 New Assignment Available</h2><p>You have new work in your portal. Please go and complete it.</p>
      <div class="newAssignmentGrid">${notices.map(n=>`<div class="newAssignmentCard"><b>${fxEsc(n.title)}</b><small>${fxEsc(n.type)}</small><small>${fxEsc(n.action)}</small></div>`).join("")}</div>
    </div>`;
  };

  function injectStudentNoticeAndMarked(){
    const view=document.getElementById("view");
    if(!view || role!=="student") return;
    if(!document.getElementById("newAssignmentNoticeBox")){
      const n=newAssignmentNoticeHTML();
      if(n) view.insertAdjacentHTML("afterbegin", n);
    }
    if(!document.getElementById("studentMarkedScriptsPanel")){
      view.insertAdjacentHTML("beforeend", studentMarkedScriptsHTML());
    }
  }

  const oldStudentHome=window.studentHome;
  if(typeof oldStudentHome==="function"){
    window.studentHome=function(){
      const result=oldStudentHome.apply(this, arguments);
      setTimeout(injectStudentNoticeAndMarked,50);
      return result;
    };
  }
  const oldStudentQuizzes=window.studentQuizzes;
  if(typeof oldStudentQuizzes==="function"){
    window.studentQuizzes=function(){
      const result=oldStudentQuizzes.apply(this, arguments);
      setTimeout(injectStudentNoticeAndMarked,50);
      return result;
    };
  }
  const oldStudentResults=window.studentResults;
  if(typeof oldStudentResults==="function"){
    window.studentResults=function(){
      const result=oldStudentResults.apply(this, arguments);
      setTimeout(injectStudentNoticeAndMarked,50);
      return result;
    };
  }

  function submissionCardHTML(ds){
    const st=fxStudent(ds.studentId)||{};
    const a=fxAssignment(ds.assignmentId);
    return `<div class="groupSubmissionCard">
      <h3>${fxEsc(st.name||"Student")}</h3>
      <p>${fxEsc(st.className||"")} • Submitted: ${fxEsc(ds.submittedAt||"")}<br>Status: <b>${ds.published?"Published":"Not Published"}</b></p>
      <div class="groupSubmissionFiles">${(ds.files||[]).map((f,i)=>`<div class="groupFileBox">
        ${String(f.type||"").startsWith("image/") ? `<img src="${f.data}" alt="">` : `<p><b>${fxEsc(f.name||"Uploaded file")}</b></p><a class="openMarkedBtn" href="${f.data}" target="_blank">Open File</a>`}
        <p>${fxEsc(f.name||"Uploaded file")}</p>
        ${String(f.type||"").startsWith("image/") ? `<button class="downloadMarkedBtn" onclick="openDigitalMarker('${ds.id}',${i})">Mark</button>` : ""}
      </div>`).join("")}</div>
      ${markedFilesHTML(ds)}
      <div class="groupMarkFields">
        <input type="number" value="${ds.score ?? ""}" placeholder="Score" onchange="setGroupedDocScore('${ds.id}',this.value)">
        <input value="${fxEsc(ds.feedback||"")}" placeholder="Feedback / comment" onchange="setGroupedDocFeedback('${ds.id}',this.value)">
      </div>
      <div class="groupActions">
        <button class="green" onclick="publishGroupedDocSubmission('${ds.id}')">${ds.published?"Unpublish":"Publish"}</button>
        <button class="light" onclick="openStudentProfileFromGrouped && openStudentProfileFromGrouped('${ds.studentId}')">Student Profile</button>
      </div>
    </div>`;
  }

  window.setGroupedDocScore=function(id,v){const ds=(state.docSubmissions||[]).find(x=>x.id===id);if(ds){ds.score=Number(v)||0;fxSave();}};
  window.setGroupedDocFeedback=function(id,v){const ds=(state.docSubmissions||[]).find(x=>x.id===id);if(ds){ds.feedback=v||"";fxSave();}};
  window.publishGroupedDocSubmission=function(id){
    const ds=(state.docSubmissions||[]).find(x=>x.id===id);
    if(!ds) return;
    const a=fxAssignment(ds.assignmentId);
    ds.published=!ds.published;
    ds.publishedAt=ds.published?fxNow():ds.publishedAt;
    if(ds.published && a.assessmentComponent){
      fxAssignToReport(ds.studentId,a.assessmentComponent,fxScorePercent(ds.score,a.maxScore||100));
    }
    fxSave();
    review();
  };
  window.openStudentProfileFromGrouped=function(studentId){
    if(typeof setRoute==="function"){ route="students"; renderShell(); setTimeout(()=>{if(typeof adminShowStudentProfileAll==="function") adminShowStudentProfileAll(studentId);},100); }
  };

  window.review=function(){
    const docGroups={};
    (state.docSubmissions||[]).forEach(ds=>{
      const key=ds.assignmentId||"unknown";
      if(!docGroups[key]) docGroups[key]=[];
      docGroups[key].push(ds);
    });
    const quizGroups={};
    (state.submissions||[]).forEach(s=>{
      const key=s.quizId||"unknown";
      if(!quizGroups[key]) quizGroups[key]=[];
      quizGroups[key].push(s);
    });

    document.getElementById("view").innerHTML=`<div class="groupedReviewCentre">
      <div class="assignmentGroupPanel"><h2>Grouped Review and Marking Centre</h2><p>Submissions are grouped by assignment so that scripts from the same work stay together.</p></div>
      ${Object.keys(docGroups).map(id=>{const a=fxAssignment(id);const rows=docGroups[id];return `<div class="assignmentGroupPanel">
        <h2>${fxEsc(a.title||"Scanned/Theory Assignment")}</h2>
        <div class="assignmentGroupMeta">
          <div><span>Type</span><b>Scanned / Theory Work</b></div>
          <div><span>Subject</span><b>${fxEsc(a.subject||"")}</b></div>
          <div><span>Submissions</span><b>${rows.length}</b></div>
          <div><span>Published</span><b>${rows.filter(x=>x.published).length}</b></div>
          <div><span>Max Score</span><b>${a.maxScore ?? "-"}</b></div>
        </div>
        <div class="groupSubmissionList">${rows.map(submissionCardHTML).join("")}</div>
      </div>`}).join("") || `<div class="assignmentGroupPanel"><h2>Scanned/Theory Work</h2><p>No scanned work submitted yet.</p></div>`}
      ${Object.keys(quizGroups).map(id=>{const q=fxQuiz(id)||{};const rows=quizGroups[id];return `<div class="assignmentGroupPanel">
        <h2>${fxEsc(q.title||"MCQ Exercise")}</h2>
        <div class="assignmentGroupMeta">
          <div><span>Type</span><b>Multiple-choice</b></div>
          <div><span>Subject</span><b>${fxEsc(q.subject||"")}</b></div>
          <div><span>Submissions</span><b>${rows.length}</b></div>
          <div><span>Published Results</span><b>${rows.filter(x=>x.published).length}</b></div>
        </div>
        <div class="groupSubmissionList">${rows.map(s=>{const st=fxStudent(s.studentId)||{};return `<div class="groupSubmissionCard"><h3>${fxEsc(st.name||"Student")}</h3><p>${fxEsc(st.className||"")}<br>Score: <b>${s.teacherScore ?? s.autoScore} / ${s.maxScore}</b><br>Status: <b>${s.published?"Published":"Not Published"}</b></p><div class="groupActions"><button class="green" onclick="publishSub && publishSub('${s.id}'); review();">${s.published?"Unpublish":"Publish"}</button><button class="light" onclick="viewStudentExerciseAnswers && viewStudentExerciseAnswers('${s.id}')">View Answers</button></div></div>`}).join("")}</div>
      </div>`}).join("")}
    </div>`;
  };

  try{
    eval("toggleMarkingFullScreen=window.toggleMarkingFullScreen; downloadMarkedScriptFile=window.downloadMarkedScriptFile; publishMarkedWork=window.publishMarkedWork; studentMarkedScriptsHTML=window.studentMarkedScriptsHTML; newAssignmentNoticeHTML=window.newAssignmentNoticeHTML; review=window.review; setGroupedDocScore=window.setGroupedDocScore; setGroupedDocFeedback=window.setGroupedDocFeedback; publishGroupedDocSubmission=window.publishGroupedDocSubmission;");
  }catch(e){}
})();

loadLocal();
if(window.importOldPortalDataIfNeeded){ importOldPortalDataIfNeeded(); }
initSupabase().then(render);
render();
</script>
</body>
