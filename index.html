function uid(p="id"){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}function now(){return new Date().toISOString()}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}function setStatus(t,type="warn"){const el=document.getElementById("syncStatus");if(el){el.textContent=t;el.className="status "+type}}function normalize(){const d=defaultState();state={...d,...(state||{})};["classes","subjects","students","quizzes","quizSubmissions","assignments","assignmentSubmissions","components","scores","reportPublications","resetRequests","announcements"].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});state.settings={...d.settings,...(state.settings||{})}}function loadLocal(){try{return JSON.parse(localStorage.getItem(LS_KEY))||defaultState()}catch(e){return defaultState()}}function saveLocal(){normalize();localStorage.setItem(LS_KEY,JSON.stringify(state))}function touch(o){if(o&&typeof o==="object")o.updatedAt=now()}function save(){normalize();state.updatedAt=now();saveLocal();schedulePush()}function initials(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase()||"?"}function active(a){return(a||[]).filter(x=>!x.deleted)}function byId(a,id){return(a||[]).find(x=>x.id===id)}function studentName(id){return byId(state.students,id)?.name||"Unknown Student"}function quizName(id){return byId(state.quizzes,id)?.title||"Unknown Quiz"}function assignmentName(id){return byId(state.assignments,id)?.title||"Unknown Assignment"}function eligible(item,st){return item&&!item.deleted&&item.published&&st&&(!item.className||item.className==="All Classes"||item.className===st.className)}function fileUrl(f){return f?.url||f?.data||""}function avatarHTML(s){return `<div class="avatar">${s.photo?`<img src="${esc(s.photo)}">`:esc(initials(s.name))}</div>`}
function render(){normalize();document.getElementById("topTitle").textContent=state.schoolName||"Sir Isaac's Mathematics Assessment Portal";if(currentRole==="admin")return renderAdmin();if(currentRole==="student")return renderStudent();return renderHome()}
function renderHome(){selectedStudentId=null;document.getElementById("app").innerHTML=`<div class="hero"><h2>${esc(state.schoolName)}</h2><p>Welcome to ${esc(state.teacherName)}'s Mathematics Assessment Portal. Select Student Portal or Teacher Admin Mode to continue.</p><div class="nav"><button class="btn green" onclick="currentRole='student';render()">Student Portal</button><span class="badge ok">129 students already loaded</span><button class="btn primary" onclick="showAdminLogin()">Teacher Admin Mode</button></div></div><div class="grid"><div class="card col-4"><h3>Live Assessments</h3><p>Students can access published quizzes and scanned assignments.</p><span class="badge ok">${active(state.quizzes).filter(q=>q.published).length} quizzes</span><span class="badge ok">${active(state.assignments).filter(a=>a.published).length} scanned work</span></div><div class="card col-4"><h3>Results and Report Cards</h3><p>Published results and report cards appear in student mode with print options.</p><span class="badge">${state.reportPublications.length} reports published</span></div><div class="card col-4"><h3>Fresh Supabase System</h3><p>The app opens first and connects Supabase in the background.</p><span class="badge ${onlineReady?'ok':'warn'}">${onlineReady?'Online connected':'Local mode'}</span></div></div>`}function showAdminLogin(){const p=prompt("Enter Teacher Admin Password");if(p===state.adminPassword){adminLogged=true;currentRole="admin";route="dashboard";render()}else if(p!==null)alert("Wrong password.")}
function navBtn(id,l){return`<button class="btn ${route===id?'primary':'light'}" onclick="route='${id}';render()">${l}</button>`}function renderAdmin(){if(!adminLogged){currentRole="home";return renderHome()}let nav=`<div class="nav noPrint">${navBtn("dashboard","Dashboard")}${navBtn("students","Students")}${navBtn("quizzes","Quizzes")}${navBtn("assignments","Scanned Work")}${navBtn("marking","Review / Marking")}${navBtn("reports","Reports")}${navBtn("announcements","Announcements")}${navBtn("settings","Settings / Backup")}<button class="btn red" onclick="adminLogged=false;currentRole='home';render()">Exit Admin</button></div>`;let body="";if(route==="dashboard")body=adminDashboard();if(route==="students")body=adminStudents();if(route==="quizzes")body=adminQuizzes();if(route==="assignments")body=adminAssignments();if(route==="marking")body=adminMarking();if(route==="reports")body=adminReports();if(route==="announcements")body=adminAnnouncements();if(route==="settings")body=adminSettings();document.getElementById("app").innerHTML=`<div class="hero"><h2>Teacher Admin Mode</h2><p>Manage students, quizzes, scanned assignments, results, report cards and live publishing.</p>${nav}</div>${body}`}
function statCard(t,n,txt){return`<div class="card col-4"><h3>${esc(t)}</h3><h2 style="font-size:34px;color:var(--navy);margin:5px 0">${n}</h2><p>${esc(txt)}</p></div>`}function adminDashboard(){const c={students:active(state.students).length,quizzes:active(state.quizzes).length,publishedQuizzes:active(state.quizzes).filter(q=>q.published).length,assignments:active(state.assignments).length,submissions:state.assignmentSubmissions.filter(s=>!s.deleted).length,quizSubmissions:state.quizSubmissions.filter(s=>!s.archived&&!s.deleted).length,reports:state.reportPublications.length};return`<div class="grid"><div class="card col-12"><h2>Supabase Fresh Live Control</h2><p class="notice">This is a clean fresh-start system. It uses Supabase only. The page opens immediately first; Supabase works in the background.</p><div class="nav"><button class="btn green" onclick="testSupabase()">Test Supabase Live</button><button class="btn light" onclick="pullRemote(true,true)">Load Online Data</button><button class="btn gold" onclick="pushRemote(true)">Publish This Browser Live</button><button class="btn primary" onclick="render()">Refresh Screen</button></div><p><span class="badge ${onlineReady?'ok':'warn'}">${onlineReady?'Supabase connected':'Not connected yet'}</span><span class="badge">Table: ${TABLE}</span><span class="badge">Storage: ${BUCKET}</span></p></div>${statCard("Students",c.students,"Active students")}${statCard("Published Quizzes",c.publishedQuizzes,"Visible to students")}${statCard("Scanned Assignments",c.assignments,"Uploaded question papers")}${statCard("Quiz Submissions",c.quizSubmissions,"Non-archived attempts")}${statCard("Scanned Submissions",c.submissions,"Student uploads")}${statCard("Published Reports",c.reports,"Student printable reports")}<div class="card col-12"><h3>Pending Reset Requests</h3>${resetRequestsTable()}</div></div>`}
function classSelect(id,val="",all=false){return`<select id="${id}" class="input">${all?`<option ${val==="All Classes"?"selected":""}>All Classes</option>`:""}${state.classes.map(c=>`<option ${val===c?"selected":""}>${esc(c)}</option>`).join("")}</select>`}function subjectSelect(id,val=""){return`<select id="${id}" class="input">${state.subjects.map(s=>`<option ${val===s?"selected":""}>${esc(s)}</option>`).join("")}</select>`}
function adminStudents(){return`<div class="grid"><div class="card col-4"><h3>Add Student</h3><label>Full Name</label><input class="input" id="stName"><label>Class</label>${classSelect("stClass")}<label>Phone Number</label><input class="input" id="stPhone"><label>Password / Code</label><input class="input" id="stPass" placeholder="Leave blank for generated code"><label>Photo</label><input class="input" type="file" id="stPhoto" accept="image/*"><button class="btn green" onclick="addStudent()">Add Student</button></div><div class="card col-8"><h3>Bulk Import Students</h3><p>Write one student per line using: <b>Name, Class, Phone</b></p><textarea id="bulkStudents" placeholder="Abena Mensah, 1 SCIENCE, 0240000000"></textarea><button class="btn gold" onclick="bulkImportStudents()">Import Students</button><button class="btn light" onclick="window.print()">Print Student List</button></div><div class="card col-12"><h3>Student List</h3><div class="nav"><input class="input" id="studentSearchAdmin" oninput="render()" placeholder="Search student..." style="max-width:320px"></div>${studentsTable()}</div></div>`}async function addStudent(){const name=document.getElementById("stName").value.trim();if(!name)return alert("Enter student name.");const st={id:uid("stu"),name,className:document.getElementById("stClass").value,phone:document.getElementById("stPhone").value.trim(),password:document.getElementById("stPass").value.trim()||Math.random().toString(36).slice(2,8).toUpperCase(),photo:"",createdAt:now(),updatedAt:now()};const f=document.getElementById("stPhoto").files[0];if(f)st.photo=await uploadFile(f,`students/${st.id}`);state.students.push(st);save();render()}function bulkImportStudents(){const txt=document.getElementById("bulkStudents").value.trim();if(!txt)return;let count=0;txt.split(/\n+/).forEach(line=>{const[name,cls,phone]=line.split(",").map(x=>String(x||"").trim());if(name){state.students.push({id:uid("stu"),name,className:cls||state.classes[0],phone:phone||"",password:Math.random().toString(36).slice(2,8).toUpperCase(),photo:"",createdAt:now(),updatedAt:now()});count++}});save();alert(count+" students imported.");render()}function studentsTable(){const q=(document.getElementById("studentSearchAdmin")?.value||"").toLowerCase();const list=active(state.students).filter(s=>(s.name+" "+s.className+" "+s.phone).toLowerCase().includes(q));return`<div class="tableWrap"><table><thead><tr><th>Photo</th><th>Name</th><th>Class</th><th>Phone</th><th>Password</th><th>Actions</th></tr></thead><tbody>${list.map(s=>`<tr><td>${avatarHTML(s)}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.className)}</td><td>${esc(s.phone||"")}</td><td><span class="badge">${esc(s.password||"")}</span></td><td><button class="btn small light" onclick="editStudent('${s.id}')">Edit</button> <button class="btn small red" onclick="deleteStudent('${s.id}')">Delete</button></td></tr>`).join("")||`<tr><td colspan="6">No students yet.</td></tr>`}</tbody></table></div>`}function editStudent(id){const s=byId(state.students,id);if(!s)return;const name=prompt("Student name",s.name);if(!name)return;Object.assign(s,{name,className:prompt("Class",s.className)||s.className,phone:prompt("Phone",s.phone||"")||"",password:prompt("Password",s.password||"")||s.password,updatedAt:now()});save();render()}function deleteStudent(id){const s=byId(state.students,id);if(s&&confirm("Delete this student from active list?")){s.deleted=true;touch(s);save();render()}}
function adminQuizzes(){return`<div class="grid"><div class="card col-4"><h3>Create Quiz</h3><label>Quiz Title</label><input class="input" id="qTitle"><label>Subject</label>${subjectSelect("qSubject")}<label>Class</label>${classSelect("qClass","All Classes",true)}<label>Duration in minutes</label><input class="input" id="qDuration" type="number" value="30"><label>Questions</label><textarea id="qQuestions" placeholder="Question | A | B | C | D | Correct letter"></textarea><button class="btn green" onclick="createQuiz()">Create Quiz</button></div><div class="card col-8"><h3>Quizzes</h3>${quizzesTable()}</div></div>`}function createQuiz(){const title=document.getElementById("qTitle").value.trim();if(!title)return alert("Enter quiz title.");const lines=document.getElementById("qQuestions").value.trim().split(/\n+/).filter(Boolean);const questions=lines.map((line,i)=>{const p=line.split("|").map(x=>x.trim());return{id:uid("que"),text:p[0]||`Question ${i+1}`,options:[p[1]||"",p[2]||"",p[3]||"",p[4]||""],answer:(p[5]||"A").trim().toUpperCase()[0]||"A"}});if(!questions.length)return alert("Add at least one question.");state.quizzes.push({id:uid("quiz"),title,subject:document.getElementById("qSubject").value,className:document.getElementById("qClass").value,duration:Number(document.getElementById("qDuration").value)||30,questions,published:false,createdAt:now(),updatedAt:now()});save();render()}function quizzesTable(){const list=active(state.quizzes);return`<div class="tableWrap"><table><thead><tr><th>Title</th><th>Subject</th><th>Class</th><th>Questions</th><th>Status</th><th>Actions</th></tr></thead><tbody>${list.map(q=>`<tr><td><b>${esc(q.title)}</b></td><td>${esc(q.subject)}</td><td>${esc(q.className)}</td><td>${q.questions?.length||0}</td><td><span class="badge ${q.published?'ok':'warn'}">${q.published?'Published':'Hidden'}</span></td><td><button class="btn small ${q.published?'red':'green'}" onclick="toggleQuiz('${q.id}')">${q.published?'Unpublish':'Publish'}</button> function adminAssignments(){return`<div class="grid"><div class="card col-4"><h3>Create Scanned Assignment</h3><label>Title</label><input class="input" id="aTitle"><label>Subject</label>${subjectSelect("aSubject")}<label>Class</label>${classSelect("aClass","All Classes",true)}<label>Max Score</label><input class="input" id="aMax" type="number" value="20"><label>Question Paper / Image / PDF</label><input class="input" id="aFile" type="file" accept="image/*,.pdf,.doc,.docx"><label>Instruction</label><textarea id="aInstruction"></textarea><button class="btn green" onclick="createAssignment()">Create Assignment</button></div><div class="card col-8"><h3>Scanned Assignments</h3>${assignmentsTable()}</div></div>`}async function createAssignment(){const title=document.getElementById("aTitle").value.trim();if(!title)return alert("Enter assignment title.");const f=document.getElementById("aFile").files[0];let questionFile=null;if(f)questionFile={name:f.name,type:f.type,url:await uploadFile(f,`assignments/${uid("assfile")}`)};state.assignments.push({id:uid("ass"),title,subject:document.getElementById("aSubject").value,className:document.getElementById("aClass").value,maxScore:Number(document.getElementById("aMax").value)||20,instruction:document.getElementById("aInstruction").value.trim(),questionFile,published:false,createdAt:now(),updatedAt:now()});save();render()}function assignmentsTable(){const list=active(state.assignments);return`<div class="tableWrap"><table><thead><tr><th>Title</th><th>Subject</th><th>Class</th><th>File</th><th>Status</th><th>Actions</th></tr></thead><tbody>${list.map(a=>`<tr><td><b>${esc(a.title)}</b></td><td>${esc(a.subject)}</td><td>${esc(a.className)}</td><td>${a.questionFile?`<a target="_blank" href="${esc(fileUrl(a.questionFile))}">Open</a>`:"No file"}</td><td><span class="badge ${a.published?'ok':'warn'}">${a.published?'Published':'Hidden'}</span></td><td><button class="btn small ${a.published?'red':'green'}" onclick="toggleAssignment('${a.id}' function adminMarking(){return`<div class="grid"><div class="card col-12"><h3>Quiz Submissions</h3>${quizSubmissionsTable(state.quizSubmissions.filter(s=>!s.deleted&&!s.archived))}</div><div class="card col-12"><h3>Scanned Assignment Submissions</h3>${assignmentSubmissionsTable(state.assignmentSubmissions.filter(s=>!s.deleted))}</div><div class="card col-12"><h3>Reset Requests</h3>${resetRequestsTable()}</div></div>`}function quizSubmissionsTable(list){return`<div class="tableWrap"><table><thead><tr><th>Student</th><th>Quiz</th><th>Score</th><th>Date</th><th>Published</th><th>Actions</th></tr></thead><tbody>${list.map(s=>`<tr><td>${esc(studentName(s.studentId))}</td><td>${esc(quizName(s.quizId))}</td><td><b>${s.score}/${s.maxScore}</b></td><td>${new Date(s.submittedAt).toLocaleString()}</td><td><span class="badge ${s.published?'ok':'warn'}">${s.published?'Yes':'No'}</span></td><td><button class="btn small ${s.published?'red':'green'}" onclick="toggleQuizResult('${s.id}')">${s.published?'Unpublish':'Publish'}</button></td></tr>`).join("")||`<tr><td colspan="6">No quiz submissions yet.</td></tr>`}</tbody></table></div>`}function toggleQuizResult(id){const s=byId(state.quizSubmissions,id);if(s){s.published=!s.published;touch(s);save();render()}}function assignmentSubmissionsTable(list){return`<div class="tableWrap"><table><thead><tr><th>Student</th><th>Assignment</th><th>Files</th><th>Score</th><th>Published</th><th>Actions</th></tr></thead><tbody>${list.map(s=>`<tr><td>${esc(studentName(s.studentId))}</td><td>${esc(assignmentName(s.assignmentId))}</td><td>${(s.files||[]).map((f,i)=>`<a target="_blank" href="${esc(fileUrl(f))}">File ${i+1}</a>`).join("<br>")}</td><td>${s.score??""}/${s.maxScore??""}</td><td><span class="badge ${s.published?'ok':'warn'}">${s.published?'Yes':'No'}</span></td><td><button class="btn small light" onclick="markAssignment('${s.id}')">Mark</button> <button class="btn small ${s.published?'red':'green'}" onclick="toggleAssignmentResult('${s.id}' function resetRequestsTable(){const list=state.resetRequests.filter(r=>!r.deleted).slice().reverse();return`<div class="tableWrap"><table><thead><tr><th>Student</th><th>Quiz</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.map(r=>`<tr><td>${esc(studentName(r.studentId))}</td><td>${esc(quizName(r.quizId))}</td><td>${esc(r.reason||"")}</td><td><span class="badge ${r.status==="Granted"?'ok':r.status==="Denied"?'bad':'warn'}">${esc(r.status)}</span></td><td>${r.status==="Pending"?`<button class="btn small green" onclick="grantReset('${r.id}')">Grant</button> <button class="btn small red" onclick="denyReset('${r.id}')">Deny</button>`:""}</td></tr>`).join("")||`<tr><td colspan="5">No reset requests.</td></tr>`}</tbody></table></div>`}function grantReset(id){const r=byId(state.resetRequests,id);if(!r)return;r.status="Granted";r.decidedAt=now();state.quizSubmissions.forEach(s=>{if(s.studentId===r.studentId&&s.quizId===r.quizId&&!s.archived){s.archived=true;s.resetByTeacher=true;touch(s)}});save();render()}function denyReset(id){const r=byId(state.resetRequests,id);if(r){r.status="Denied";r.decidedAt=now();save();render()}}
function adminReports(){return`<div class="grid"><div class="card col-4"><h3>Add Score Component</h3><label>Component Name</label><input class="input" id="cName" placeholder="Class Test / Assignment / Exam"><label>Subject</label>${subjectSelect("cSubject")}<label>Class</label>${classSelect("cClass","All Classes",true)}<label>Type</label><select id="cType" class="input"><option>CA</option><option>Exam</option></select><label>Max Score</label><input class="input" id="cMax" type="number" value="100"><button class="btn green" onclick="addComponent()">Add Component</button></div><div class="card col-8"><h3>Enter Scores / Publish Reports</h3><label>Select Component</label><select id="scoreComponent" class="input" onchange="render()">${active(state.components).map(c=>`<option value="${c.id}">${esc(c.name)} - ${esc(c.subject)} - ${esc(c.className)} - ${esc(c.type)}</option>`).join("")}</select>${scoreEntryTable()}</div><div class="card col-12"><h3>Components</h3>${componentsTable()}</div></div>`}function addComponent(){const name=document.getElementById("cName").value.trim();if(!name)return alert("Enter component name.");state.components.push({id:uid("comp"),name,subject:document.getElementById("cSubject").value,className:document.getElementById("cClass").value,type:document.getElementById("cType").value,maxScore:Number(document.getElementById("cMax").value)||100,createdAt:now(),updatedAt:now()});save();render()}function componentsTable(){const list=active(state.components);return`<div class="tableWrap"><table><thead><tr><th>Name</th><th>Subject</th><th>Class</th><th>Type</th><th>Max</th><th>Action</th></tr></thead><tbody>${list.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.subject)}</td><td>${esc(c.className)}</td><td>${esc(c.type)}</td><td>${c.maxScore}</td><td><button class="btn small red" onclick="deleteComponent('${c.id}')">Delete</button></td></tr>`).join("")||`<tr><td colspan="6">No components.</td></tr>`}</tbody></table></div>`}function deleteComponent(id){const c=byId(state.components,id);if(c&&confirm("Delete this component?")){c.deleted=true;touch(c);save();render()}}function getScore(studentId,componentId){return state.scores.find(x=>x.studentId===studentId&&x.componentId===componentId&&!x.deleted)?.score}function scoreEntryTable(){const compId=document.getElementById("scoreComponent")?.value||active(state.components)[0]?.id;const c=byId(state.components,compId);if(!c)return`<p class="notice">Add a score component first.</p>`;const students=active(state.students).filter(s=>c.className==="All Classes"||s.className===c.className);return`<div class="nav"><button class="btn gold" onclick="saveScores('${c.id}')">Save Scores</button><button class="btn green" onclick="publishReportsForComponent('${c.id}')">Publish Reports for this Subject/Class</button></div><div class="tableWrap"><table><thead><tr><th>Student</th><th>Class</th><th>Score out of ${c.maxScore}</th></tr></thead><tbody>${students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.className)}</td><td><input class="input" type="number" min="0" max="${c.maxScore}" id="score_${s.id}" value="${getScore(s.id,c.id)??""}"></td></tr>`).join("")||`<tr><td colspan="3">No students in this class.</td></tr>`}</tbody></table></div>`}function saveScores(componentId){active(state.students).forEach(st=>{const el=document.getElementById("score_"+st.id);if(!el||el.value==="")return;let row=state.scores.find(x=>x.studentId===st.id&&x.componentId===componentId&&!x.deleted);if(!row){row={id:uid("score"),studentId:st.id,componentId,createdAt:now()};state.scores.push(row)}row.score=Number(el.value);touch(row)});save();alert("Scores saved.");render()}function publishReportsForComponent(componentId){const c=byId(state.components,componentId);if(!c)return;active(state.students).filter(s=>c.className==="All Classes"||s.className===c.className).forEach(s=>{let pub=state.reportPublications.find(x=>x.studentId===s.id&&x.subject===c.subject&&x.academicYear===state.settings.academicYear&&x.semester===state.settings.semester);if(!pub){pub={id:uid("rep"),studentId:s.id,subject:c.subject,academicYear:state.settings.academicYear,semester:state.settings.semester,createdAt:now()};state.reportPublications.push(pub)}pub.published=true;touch(pub)});save();alert("Reports published.");render()}function calculateReport(studentId,subject){const comps=active(state.components).filter(c=>c.subject===subject);let caGot=0,caMax=0,examGot=0,examMax=0;comps.forEach(c=>{const sc=getScore(studentId,c.id);if(sc===undefined||sc===null||sc==="")return;if(c.type==="Exam"){examGot+=Number(sc);examMax+=Number(c.maxScore||100)}else{caGot+=Number(sc);caMax+=Number(c.maxScore||100)}});const ca30=caMax?caGot/caMax*30:0,exam70=examMax?examGot/examMax*70:0,total=Math.round((ca30+exam70)*10)/10;return{ca30,exam70,total,grade:grade(total),remark:remark(total)}}function grade(x){if(x>=80)return"A1";if(x>=70)return"B2";if(x>=65)return"B3";if(x>=60)return"C4";if(x>=55)return"C5";if(x>=50)return"C6";if(x>=45)return"D7";if(x>=40)return"E8";return"F9"}function remark(x){if(x>=80)return"Excellent";if(x>=70)return"Very Good";if(x>=60)return"Good";if(x>=50)return"Credit";if(x>=40)return"Pass";return"Needs serious support"}

function renderStudent(){const st=byId(state.students,selectedStudentId);if(!st)return renderStudentPicker();const nav=`<div class="nav noPrint"><button class="btn ${route==='home'?'primary':'light'}" onclick="route='home';render()">Home</button><button class="btn ${route==='work'?'primary':'light'}" onclick="route='work';render()">My Work</button><button class="btn ${route==='results'?'primary':'light'}" onclick="route='results';render()">My Results</button><button class="btn ${route==='report'?'primary':'light'}" onclick="route='report';render()">View Report Card</button><button class="btn red" onclick="selectedStudentId=null;render()">Change Student</button></div>`;let body="";if(route==="home")body=studentHome(st);if(route==="work")body=studentWork(st);if(route==="results")body=studentResults(st);if(route==="report")body=studentReport(st);document.getElementById("app").innerHTML=`<div class="hero"><h2>Student Portal</h2><p>${esc(st.name)} • ${esc(st.className)}</p>${nav}</div>${body}`}function renderStudentPicker(){const q=(document.getElementById("studentSearch")?.value||"").toLowerCase(),cls=document.getElementById("studentClassFilter")?.value||"All Classes";const list=active(state.students).filter(s=>(cls==="All Classes"||s.className===cls)&&(s.name+" "+s.className+" "+(s.phone||"")).toLowerCase().includes(q));document.getElementById("app").innerHTML=`<div class="hero"><h2>Student Portal</h2><p>Search your name or select from the full student list. All students appear first.</p><div class="nav"><button class="btn light" onclick="currentRole='home';render()">Back</button></div></div><div class="card"><h3>Find Your Name</h3><div class="grid" style="margin-top:0"><div class="col-8"><input class="input" id="studentSearch" placeholder="Search by name, class or phone..." oninput="render()" value="${esc(document.getElementById("studentSearch")?.value||"")}"></div><div class="col-4"><select id="studentClassFilter" class="input" onchange="render()"><option>All Classes function startQuiz(id){const q=byId(state.quizzes,id),s=byId(state.students,selectedStudentId);if(!q||!s)return;if(activeSubmissionFor(s.id,q.id))return alert("You have already submitted this quiz. Request reset if needed.");if(!confirm(`Start ${q.title}?\nTime: ${q.duration} minutes.`))return;activeQuiz={quizId:id,answers:{}};quizSecondsLeft=(Number(q.duration)||30)*60;route="takeQuiz";renderTakeQuiz();clearInterval(quizTimer);quizTimer=setInterval(()=>{quizSecondsLeft--;updateTimer();if(quizSecondsLeft<=0)submitQuiz(true)},1000)}function renderTakeQuiz(){const q=byId(state.quizzes,activeQuiz.quizId);if(!q)return render();document.getElementById("app").innerHTML=`<div class="hero"><h2>${esc(q.title)}</h2><p>${esc(q.subject)}</p><div class="timer" id="timerBox"></div></div><div class="card">${q.questions.map((x,i)=>`<div class="question"><b>${i+1}. ${esc(x.text)}</b><div class="options">${["A","B","C","D"].map((L,idx)=>`<label class="option"><input type="radio" name="${x.id}" value="${L}" onchange="activeQuiz.answers['${x.id}']='${L}'"> <span><b>${L}.</b> ${esc(x.options[idx]||"")}</span></label>`).join("")}</div></div>`).join("")}<button class="btn green" onclick="submitQuiz(false)">Submit Quiz</button></div>`;updateTimer()}function updateTimer(){const el=document.getElementById("timerBox");if(el)el.textContent=`Time left: ${Math.floor(quizSecondsLeft/60)}:${String(quizSecondsLeft%60).padStart(2,"0")}`}function submitQuiz(auto=false){if(!activeQuiz)return;const q=byId(state.quizzes,activeQuiz.quizId),s=byId(state.students,selectedStudentId);if(!q||!s)return;if(!auto&&!confirm("Submit quiz now?"))return;clearInterval(quizTimer);let score=0;q.questions.forEach(x=>{if((activeQuiz.answers[x.id]||"").toUpperCase()===x.answer)score++});state.quizSubmissions.push({id:uid("qsub"),studentId:s.id,quizId:q.id,answers:activeQuiz.answers,score,maxScore:q.questions.length,published:false,submittedAt:now(),updatedAt:now()});activeQuiz=null;route="results";save();alert(auto?"Time function assignmentStudentCard(a,s){const sub=state.assignmentSubmissions.find(x=>x.studentId===s.id&&x.assignmentId===a.id&&!x.deleted);return`<div class="question"><b>${esc(a.title)}</b><p>${esc(a.subject)} • Max score: ${a.maxScore}</p><p>${esc(a.instruction||"")}</p>${a.questionFile?`<a class="btn small light" target="_blank" href="${esc(fileUrl(a.questionFile))}">Open Question</a>`:""} ${sub?`<span class="badge ok">Submitted</span> ${sub.published?`<span class="badge ok">Marked: ${sub.score}/${sub.maxScore}</span>`:""}`:`<button class="btn green" onclick="submitAssignment('${a.id}')">Upload Answer</button>`}</div>`}async function submitAssignment(id){const a=byId(state.assignments,id),s=byId(state.students,selectedStudentId);if(!a||!s)return;const input=document.createElement("input");input.type="file";input.accept="image/*,.pdf,.doc,.docx";input.multiple=true;input.onchange=async()=>{if(!input.files.length)return;const files=[];for(const f of input.files){files.push({name:f.name,type:f.type,url:await uploadFile(f,`student-submissions/${s.id}/${id}`)})}state.assignmentSubmissions.push({id:uid("asub"),studentId:s.id,assignmentId:id,files,maxScore:a.maxScore,score:null,feedback:"",published:false,submittedAt:now(),updatedAt:now()});save();alert("Submitted successfully.");render()};input.click()}function studentResults(s){const qs=state.quizSubmissions.filter(x=>x.studentId===s.id&&!x.archived&&!x.deleted&&x.published),as=state.assignmentSubmissions.filter(x=>x.studentId===s.id&&!x.deleted&&x.published);return`<div class="grid"><div class="card col-6"><h3>Published Quiz Results</h3>${qs.map(x=>`<div class="question"><b>${esc(quizName(x.quizId))}</b><p>Score: <b>${x.score}/${x.maxScore}</b></p></div>`).join("")||"<p>No published quiz result yet.</p>"}</div><div class="card col-6"><h3>Marked Scanned Work</h3>${as.map(x=>`<div class="question"><b>${esc(assignmentName(x.assignmentId))}</b><p>Score: <b>${x.score}/${x.maxScore}</b></p><p>${esc(x.feedback||"")}</p>${(x.markedFiles||[]).map((f,i)=>`<a target="_blank" href="${esc(fileUrl(f))}">Download Marked File ${i+1}</a>`).join("<br>")}</div>`).join("")||"<p>No marked scanned work yet.</p>"}</div></div>`}function studentReport(s){const pubs=state.reportPublications.filter(x=>x.studentId===s.id&&x.published);if(!pubs.length)return`<div class="card"><p class="notice">No report card has been published for you yet.</p></div>`;const subject=pubs[0].subject,r=calculateReport(s.id,subject);return`<div class="card"><div class="nav noPrint"><button class="btn gold" onclick="window.print()">Print Report Card</button></div>${reportHTML(s,subject,r)}</div>`}function reportHTML(s,subject,r){return`<div class="printCard"><div class="reportHead"><h2>${esc(state.schoolName)}</h2><p><b>Student Report Card</b></p><p>${esc(state.settings.academicYear)} • ${esc(state.settings.semester)}</p></div><p><b>Name:</b> ${esc(s.name)}<br><b>Class:</b> ${esc(s.className)}<br><b>Subject:</b> ${esc(subject)}</p><table style="min-width:0"><thead><tr><th>Assessment</th><th>Type</th><th>Score</th><th>Max</th></tr></thead><tbody>${active(state.components).filter(c=>c.subject===subject).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.type)}</td><td>${getScore(s.id,c.id)??""}</td><td>${c.maxScore}</td></tr>`).join("")}</tbody></table><p><b>CA (30%):</b> ${r.ca30.toFixed(1)} &nbsp; <b>Exam (70%):</b> ${r.exam70.toFixed(1)} &nbsp; <b>Total:</b> ${r.total.toFixed(1)} &nbsp; <b>Grade:</b> ${r.grade}</p><p><b>Remark:</b> ${esc(r.remark)}</p><br><p>Teacher's Signature: ________________________</p></div>`}
async function initSupabase(){render();setStatus("App opened. Connecting Supabase in background...","warn");try{if(!window.AMEST_SUPABASE_URL||!window.AMEST_SUPABASE_ANON_KEY||String(window.AMEST_SUPABASE_URL).includes("PASTE")){setStatus("Supabase config missing. App is in local mode.","warn");return}if(!window.supabase){setStatus("Supabase library failed to load. App is in local mode.","bad");return}sb=window.supabase.createClient(window.AMEST_SUPABASE_URL,window.AMEST_SUPABASE_ANON_KEY);await pullRemote(true,false);subscribeRealtime();onlineReady=true;setStatus("Supabase connected","ok");render()}catch(e){console.error(e);setStatus("Supabase not connected. App still works locally.","bad")}}async function testSupabase(){try{if(!sb)await initSupabase();const{error}=await sb.from(TABLE).select("id,updated_at").eq("id",ROW_ID).maybeSingle();if(error)throw error;alert("Supabase is working. Table is reachable.")}catch(e){console.error(e);alert("Supabase test failed. Run the SQL setup file again, then refresh.")}}async function pullRemote(merge=true,showAlert=false){if(!sb)return false;const{data,error}=await sb.from(TABLE).select("data,updated_at").eq("id",ROW_ID).maybeSingle();if(error)throw error;if(data&&data.data&&hasImportantData(data.data)){state=merge?mergeState(data.data,state):data.data;saveLocal();if(showAlert)alert("Online data loaded.");render();return true}else{if(hasImportantData(state))await pushRemote(false);return false}}function schedulePush(){clearTimeout(pushTimer);pushTimer=setTimeout(()=>pushRemote(false),900)}async function pushRemote(showAlert=false){if(working)return false;if(!sb){if(showAlert)alert("Supabase is not connected yet. Check app-config.js and SQL setup.");return false}working=true;try{setStatus("Saving live...","warn");let remote=null;try{const{data}=await sb.from(TABLE).select("data").eq("id",ROW_ID).maybeSingle();remote=data?.data||null}catch(e){}if(remote)state=mergeState(remote,state);state.updatedAt=now();saveLocal();const{error}=await sb.from(TABLE).upsert({id:ROW_ID,data:state,updated_at:now()},{onConflict:"id"});if(error)throw error;onlineReady=true;setStatus("Saved live","ok");if(showAlert)alert("Published live successfully.");return true}catch(e){console.error(e);setStatus("Live save failed. Check SQL setup.","bad");if(showAlert)alert("Live save failed. Run the SQL file again.");return false}finally{working=false}}function subscribeRealtime(){if(!sb)return;sb.channel("fresh-portal-state").on("postgres_changes",{event:"*",schema:"public",table:TABLE,filter:`id=eq.${ROW_ID}`},payload=>{if(payload?.new?.data&&!working){state=mergeState(payload.new.data,state);saveLocal();setStatus("Live update received","ok");if(currentRole==="student"||currentRole==="admin")render()}}).subscribe();setInterval(()=>{if(sb&&(currentRole==="student"||currentRole==="admin"))pullRemote(true,false).catch(()=>{})},15000)}function hasImportantData(st){return!!(st&&((st.students||[]).length||(st.quizzes||[]).length||(st.assignments||[]).length||(st.quizSubmissions||[]).length||(st.assignmentSubmissions||[]).length||(st.reportPublications||[]).length))}function mergeState(remote,local){const d=defaultState();remote={...d,...(remote||{})};local={...d,...(local||{})};const out={...remote,...local,settings:{...(remote.settings||{}),...(local.settings||{})}};["classes","subjects"].forEach(k=>out[k]=[...new Set([...(remote[k]||[]),...(local[k]||[])])]);["students","quizzes","quizSubmissions","assignments","assignmentSubmissions","components","scores","reportPublications","resetRequests","announcements"].forEach(k=>out[k]=mergeArray(remote[k]||[],local[k]||[]));return out}function mergeArray(a,b){const m=new Map();[...a,...b].forEach(x=>{if(!x)return;const id=x.id||uid("row"),old=m.get(id);if(!old)m.set(id,x);else{const ot=new Date(old.updatedAt||old.createdAt||0).getTime(),nt=new Date(x.updatedAt||x.createdAt||0).getTime();m.set(id,nt>=ot?{...old,...x}:{...x,...old})}});return[...m.values()]}async function uploadFile(file,folder){if(!file)return"";if(sb){try{const safe=file.name.replace(/[^\w.\-]+/g,"_");const path=`${folder}/${Date.now()}_${Math.random().toString(36).slice(2)}_${safe}`;const{error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:true,contentType:file.type||"application/octet-stream"});if(error)throw error;const{data}=sb.storage.from(BUCKET).getPublicUrl(path);return data.publicUrl}catch(e){console.error("Storage failed, using local fallback",e);setStatus("Storage upload failed. File kept locally if small.","bad")}}return await fileToDataURL(file)}function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
