<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Supabase Connection Check</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-config.js"></script>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;padding:24px;color:#071f3d}
.card{max-width:760px;margin:auto;background:white;border-radius:20px;padding:20px;box-shadow:0 12px 28px rgba(7,31,61,.12)}
.ok{color:#0f7b4f;font-weight:900}.bad{color:#b42318;font-weight:900}.warn{color:#8a6100;font-weight:900}
pre{background:#f7f9fc;border:1px solid #d8e2ee;border-radius:12px;padding:12px;white-space:pre-wrap}
button{background:#071f3d;color:white;border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h2>Supabase Connection Check</h2>
<p>This page checks whether <b>app-config.js</b>, the table <b>portal_live_state</b>, and the storage bucket <b>portal-files</b> are working.</p>
<button onclick="runCheck()">Run Check</button>
<pre id="out">Click Run Check.</pre>
</div>
<script>
async function runCheck(){
 const out=document.getElementById('out');
 try{
  out.textContent='Checking...';
  if(!window.AMEST_SUPABASE_URL || !window.AMEST_SUPABASE_ANON_KEY){
    out.innerHTML='❌ Supabase URL or anon key missing in app-config.js';
    return;
  }
  const sb=supabase.createClient(window.AMEST_SUPABASE_URL, window.AMEST_SUPABASE_ANON_KEY);
  let report='';
  report += 'URL: '+window.AMEST_SUPABASE_URL+'\n';
  const {data,error}=await sb.from('portal_live_state').select('id,data,updated_at').eq('id','main').maybeSingle();
  if(error){ report += '❌ Table test failed: '+error.message+'\n'; }
  else if(!data){ report += '⚠️ Table exists but row main was not found. Run the SQL file again.\n'; }
  else{ report += '✅ Table connected. Students online: '+((data.data&&data.data.students)||[]).length+'\n'; }
  const {data:files,error:sterr}=await sb.storage.from('portal-files').list('',{limit:1});
  if(sterr){ report += '❌ Storage test failed: '+sterr.message+'\n'; }
  else{ report += '✅ Storage bucket connected.\n'; }
  out.textContent=report;
 }catch(e){
  out.textContent='❌ Connection check failed: '+(e.message||e);
 }
}
</script>
</body>
</html>
