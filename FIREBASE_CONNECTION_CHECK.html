<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Firebase Connection Check</title>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>body{font-family:Arial;background:#f4f7fb;padding:24px;color:#071f3d}.card{max-width:820px;margin:auto;background:white;border-radius:20px;padding:20px;box-shadow:0 12px 28px rgba(7,31,61,.12)}pre{background:#f7f9fc;border:1px solid #d8e2ee;border-radius:12px;padding:12px;white-space:pre-wrap}button{background:#071f3d;color:white;border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}</style></head>
<body><div class="card"><h2>Firebase Connection Check</h2><p>This checks Firestore path <b>portal_live_state/main</b>.</p><button onclick="runCheck()">Run Check</button><pre id="out">Click Run Check.</pre></div>
<script>
async function runCheck(){const out=document.getElementById('out');try{out.textContent='Checking...';if(!window.FIREBASE_CONFIG||!window.FIREBASE_CONFIG.apiKey){out.textContent='❌ firebase-config.js missing.';return;}if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);const db=firebase.firestore();const snap=await db.collection('portal_live_state').doc('main').get();let txt='Project ID: '+window.FIREBASE_CONFIG.projectId+'\n';if(!snap.exists){txt+='⚠️ Firestore works, but online portal data is empty. Open the app once; it will auto-publish the seeded 205 students.\n';}else{const d=snap.data().data||{};txt+='✅ Firestore connected.\nStudents online: '+((d.students||[]).filter(x=>!x.deleted).length)+'\nQuizzes online: '+((d.quizzes||[]).length)+'\nScanned assignments: '+((d.docAssignments||[]).length)+'\nScanned submissions: '+((d.docSubmissions||[]).length)+'\n';}txt+='Cloudinary: '+(window.CLOUDINARY_CLOUD_NAME||'missing')+' / '+(window.CLOUDINARY_UPLOAD_PRESET||'missing');out.textContent=txt;}catch(e){out.textContent='❌ Firebase check failed: '+(e.message||e)+'\nCheck Firestore rules.';}}
</script></body></html>
