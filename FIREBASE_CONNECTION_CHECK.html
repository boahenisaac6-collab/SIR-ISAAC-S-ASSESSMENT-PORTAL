<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Firebase Stable v3 Connection Check</title>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;padding:24px;color:#071f3d}.card{max-width:850px;margin:auto;background:white;border-radius:20px;padding:20px;box-shadow:0 12px 28px rgba(7,31,61,.12)}pre{background:#f7f9fc;border:1px solid #d8e2ee;border-radius:12px;padding:12px;white-space:pre-wrap}button{background:#071f3d;color:white;border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}.ok{color:#0f7b4f}.bad{color:#b42318}.warn{color:#8a6100}
</style>
</head>
<body>
<div class="card"><h2>Firebase Stable v3 Connection Check</h2><p>This checks the clean stable document: <b>portal_live_state/main_205_click_fixed_v4</b>.</p><button onclick="runCheck()">Run Check</button><pre id="out">Click Run Check.</pre></div>
<script>
async function runCheck(){
 const out=document.getElementById('out');
 try{
  out.textContent='Checking Firebase stable v3...';
  if(!window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey){out.textContent='❌ firebase-config.js is missing or wrong.';return;}
  if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
  const db=firebase.firestore();
  const ref=db.collection('portal_live_state').doc('main_205_click_fixed_v4');
  const snap=await ref.get();
  let report='Project ID: '+window.FIREBASE_CONFIG.projectId+'
';
  if(!snap.exists){report+='⚠️ Stable online document is empty. Open the main app once and wait 10 seconds, or click Publish/Save in admin.
';}
  else{
    const data=snap.data().data || {};
    const students=(data.students||[]).length;
    const assignments=(data.docAssignments||[]).length;
    const submissions=(data.docSubmissions||[]).length + (data.submissions||[]).length;
    report+='✅ Firestore connected.
Students online: '+students+' / expected 205
Scanned assignments: '+assignments+'
Submissions: '+submissions+'
';
    if(students<205) report+='⚠️ Student count is below 205. Open the main app and press Ctrl + Shift + R. The stable repair will refill it.
';
  }
  report+='Cloudinary cloud name: '+(window.CLOUDINARY_CLOUD_NAME||'missing')+'
Cloudinary preset: '+(window.CLOUDINARY_UPLOAD_PRESET||'missing')+'
';
  out.textContent=report;
 }catch(e){out.textContent='❌ Firebase check failed: '+(e.message||e)+'

Check Firestore Rules and firebase-config.js.';}
}
</script></body></html>
